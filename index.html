<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>孕妇备产清单</title>
  <style>
    * { box-sizing: border-box; }
    :root { --rose:#e85d8b; --rose-dark:#be2f62; --ink:#172033; --muted:#667085; --line:#f5d6df; --paper:rgba(255,255,255,.82); --shadow:0 24px 70px rgba(170,93,121,.16); }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; background: radial-gradient(circle at 15% 14%, rgba(252,186,211,.55), transparent 27%), radial-gradient(circle at 86% 4%, rgba(183,209,255,.42), transparent 28%), radial-gradient(circle at 48% 98%, rgba(255,228,181,.48), transparent 30%), linear-gradient(135deg,#fff7fa,#fff1f4 48%,#fff8ec); }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; border:0; }
    .wrap { width:min(1180px, calc(100% - 32px)); margin:0 auto; }
    .hero { margin:32px auto 24px; padding:32px; border-radius:32px; background:var(--paper); border:1px solid rgba(255,255,255,.84); box-shadow:var(--shadow); backdrop-filter: blur(22px); display:grid; grid-template-columns:1.2fr .8fr; gap:32px; align-items:center; }
    .pill { display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:999px; background:rgba(255,255,255,.76); color:var(--rose-dark); font-weight:700; border:1px solid #ffe0e8; }
    h1 { margin:14px 0 0; font-size:clamp(36px, 5vw, 58px); line-height:1.06; letter-spacing:-.04em; }
    .lead { margin:18px 0 0; max-width:720px; color:#5d6679; line-height:1.9; font-size:18px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:12px 20px; font-weight:800; transition:.2s ease; }
    .btn:hover { transform:translateY(-1px); }
    .btn-primary { color:#fff; background:#111827; box-shadow:0 14px 30px rgba(232,93,139,.24); }
    .btn-primary:hover { background:var(--rose-dark); }
    .btn-soft { color:var(--rose-dark); background:rgba(255,255,255,.86); border:1px solid #ffd9e4; }
    .progress-card { border-radius:28px; padding:22px; background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,228,236,.82)); border:1px solid rgba(255,255,255,.92); }
    .progress-head { display:flex; justify-content:space-between; gap:16px; align-items:center; }
    .eyebrow { margin:0; color:var(--rose-dark); font-size:14px; font-weight:800; }
    .big-number { margin:4px 0 0; font-size:36px; font-weight:950; letter-spacing:-.04em; }
    .badge { width:64px; height:64px; display:grid; place-items:center; border-radius:18px; background:#fff; color:var(--rose-dark); font-size:36px; box-shadow: inset 0 0 0 1px #ffe2ea; }
    .bar { height:14px; margin-top:18px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.9); border:1px solid #ffe0e8; }
    .bar > i { display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#fb7185,#ec4899,#fb923c); transition:width .45s ease; }
    .mini-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
    .mini { padding:12px; text-align:center; background:rgba(255,255,255,.78); border-radius:18px; }
    .mini span { display:block; color:var(--muted); font-size:12px; }
    .mini strong { display:block; margin-top:2px; font-size:22px; }
    .toolbar { position:sticky; top:12px; z-index:10; margin-bottom:22px; padding:16px; border-radius:26px; background:rgba(255,255,255,.76); border:1px solid rgba(255,255,255,.86); box-shadow:0 18px 50px rgba(170,93,121,.12); backdrop-filter:blur(18px); display:grid; grid-template-columns:1fr 210px 170px; gap:12px; }
    .searchbox { position:relative; }
    .searchbox span { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#98a2b3; }
    input, select, textarea { width:100%; border:1px solid #ffe0e8; outline:0; background:rgba(255,255,255,.86); border-radius:18px; padding:13px 15px; color:#243047; }
    .searchbox input { padding-left:42px; }
    input:focus, select:focus, textarea:focus { border-color:#f5a5bd; box-shadow:0 0 0 4px rgba(232,93,139,.12); }
    .category-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
    .stat-card { text-align:left; padding:16px; border-radius:24px; background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.8); box-shadow:0 12px 34px rgba(170,93,121,.08); transition:.2s ease; }
    .stat-card:hover { transform:translateY(-2px); box-shadow:0 18px 45px rgba(170,93,121,.14); }
    .stat-top { display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:900; }
    .stat-top b { color:var(--rose-dark); }
    .stat-card p { margin:6px 0 0; color:var(--muted); font-size:14px; }
    .list { display:grid; gap:22px; padding-bottom:50px; }
    .section { overflow:hidden; border-radius:30px; background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.85); box-shadow:0 18px 50px rgba(170,93,121,.1); }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:20px 22px; border-bottom:1px solid #ffe5ec; background:rgba(255,255,255,.58); }
    .section h2 { margin:0; font-size:22px; letter-spacing:-.02em; }
    .section-sub { margin:4px 0 0; color:var(--muted); font-size:14px; }
    .add-category { color:var(--rose-dark); background:#fff0f5; padding:10px 15px; border-radius:999px; font-weight:800; white-space:nowrap; }
    .items { display:grid; }
    .item { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 22px; border-top:1px solid #fff1f5; }
    .item:first-child { border-top:0; }
    .item label { min-width:0; flex:1; display:flex; align-items:flex-start; gap:14px; cursor:pointer; }
    .item input[type="checkbox"] { width:20px; height:20px; flex:0 0 auto; margin:2px 0 0; accent-color:var(--rose); box-shadow:none; }
    .item-title { display:block; font-weight:900; line-height:1.35; word-break:break-word; }
    .item-meta { display:block; margin-top:5px; color:var(--muted); font-size:14px; line-height:1.55; }
    .item-meta strong { color:#344054; }
    .item.done { background:linear-gradient(90deg, rgba(236,253,245,.95), rgba(255,247,250,.72)); }
    .item.done .item-title { color:#087f5b; text-decoration:none; }
    .item-content { min-width:0; flex:1; display:flex; align-items:flex-start; gap:12px; }
    .thumb { width:58px; height:58px; flex:0 0 auto; border-radius:18px; object-fit:cover; border:1px solid #ffe0e8; background:#fff7fa; box-shadow:0 8px 18px rgba(170,93,121,.12); }
    .image-upload { display:grid; gap:10px; padding:14px; border:1px dashed #f3b8c9; border-radius:20px; background:#fff8fb; }
    .image-preview { display:none; width:96px; height:96px; border-radius:22px; object-fit:cover; border:1px solid #ffe0e8; }
    .image-preview.show { display:block; }
    .link-btn { width:auto; color:var(--rose-dark); background:transparent; padding:0; font-weight:800; }
    .item-actions { display:flex; gap:8px; flex:0 0 auto; }
    .small-btn { border-radius:999px; padding:9px 13px; font-size:14px; font-weight:800; }
    .edit-btn { color:#475467; background:#f2f4f7; }
    .delete-btn { color:var(--rose-dark); background:#fff0f5; }
    .empty { display:none; margin-bottom:50px; padding:44px; text-align:center; border-radius:30px; border:1px dashed #f2b8c8; background:rgba(255,255,255,.72); }
    .empty.show { display:block; }
    .empty .icon { display:block; font-size:48px; color:#f3a8bd; }
    .modal { display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center; padding:18px; background:rgba(15,23,42,.38); }
    .modal.show { display:flex; }
    .dialog { width:min(560px,100%); padding:24px; border-radius:30px; background:#fff; box-shadow:0 28px 90px rgba(15,23,42,.24); }
    .dialog-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .dialog-title { margin:4px 0 0; font-size:28px; font-weight:950; }
    .close { width:40px; height:40px; border-radius:999px; color:#667085; background:#f2f4f7; font-size:24px; }
    .form-grid { display:grid; gap:15px; }
    label.field { display:grid; gap:8px; color:#344054; font-size:14px; font-weight:800; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    textarea { resize:vertical; min-height:92px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .cancel { background:#f2f4f7; color:#475467; }
    .save { background:var(--rose); color:#fff; }
    .icon { display:inline-flex; align-items:center; justify-content:center; line-height:1; }
    @media (max-width: 900px) { .hero { grid-template-columns:1fr; padding:24px; } .toolbar { grid-template-columns:1fr; } .category-stats { grid-template-columns:repeat(2,1fr); } }
    @media (max-width: 640px) { .wrap { width:min(100% - 22px,1180px); } .hero { margin-top:18px; border-radius:26px; } .mini-stats, .two-col { grid-template-columns:1fr; } .category-stats { grid-template-columns:1fr; } .section-head, .item { align-items:stretch; flex-direction:column; } .item-actions { align-self:flex-end; } .add-category { width:100%; } }
  </style>
</head>
<body>
  <header class="wrap hero">
    <div>
      <div class="pill"><span class="icon">♡</span> Baby 及待产准备</div>
      <h1>孕妇备产清单</h1>
      <p class="lead">把妈妈和宝宝的待产物品整理成可勾选、可搜索、可增删改的网页清单。记录会同步保存到云端，其他人打开同一个链接也能看到最新状态。</p>
      <div class="actions">
        <button id="addTopBtn" class="btn btn-primary"><span class="icon">＋</span> 新增物品</button>
        <button id="resetBtn" class="btn btn-soft"><span class="icon">↻</span> 恢复初始清单</button>
        <span id="syncStatus" class="pill">云端同步中…</span>
      </div>
    </div>
    <aside class="progress-card">
      <div class="progress-head"><div><p class="eyebrow">当前完成度</p><p id="progressText" class="big-number">0/0</p></div><div class="badge">✓</div></div>
      <div class="bar"><i id="progressBar"></i></div>
      <div class="mini-stats"><div class="mini"><span>总计</span><strong id="totalCount">0</strong></div><div class="mini"><span>已完成</span><strong id="doneCount">0</strong></div><div class="mini"><span>待准备</span><strong id="todoCount">0</strong></div></div>
    </aside>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <label class="searchbox"><span>⌕</span><input id="searchInput" placeholder="搜索物品、分类或备注，例如：奶瓶、妈妈、童泰" /></label>
      <select id="categoryFilter"></select>
      <select id="statusFilter"><option value="all">全部状态</option><option value="todo">只看待准备</option><option value="done">只看已完成</option></select>
    </section>
    <section id="categoryStats" class="category-stats"></section>
    <section id="listRoot" class="list"></section>
    <section id="emptyState" class="empty"><span class="icon">⌕</span><h2>没有找到匹配物品</h2><p>试试换个关键词，或新增一个清单项。</p></section>
  </main>

  <div id="itemModal" class="modal">
    <form id="itemForm" class="dialog">
      <div class="dialog-head"><div><p class="eyebrow">清单编辑</p><h2 id="modalTitle" class="dialog-title">新增物品</h2></div><button type="button" id="closeModalBtn" class="close">×</button></div>
      <input type="hidden" id="itemId" />
      <div class="form-grid">
        <label class="field">物品名称<input id="itemName" required placeholder="例如：160毫升玻璃奶瓶" /></label>
        <div class="two-col"><label class="field">分类<input id="itemCategory" required list="categoryOptions" placeholder="例如：宝宝部分·吃" /><datalist id="categoryOptions"></datalist></label><label class="field">数量/规格<input id="itemQty" placeholder="例如：×1、S码200片" /></label></div>
        <label class="field">备注<textarea id="itemNote" rows="3" placeholder="购买地点、用途或提醒"></textarea></label>
        <label class="field image-upload">物品图片
          <input id="itemImage" type="file" accept="image/*" />
          <img id="imagePreview" class="image-preview" alt="物品图片预览" />
          <button id="removeImageBtn" type="button" class="link-btn">移除图片</button>
        </label>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelBtn" class="btn cancel">取消</button><button class="btn save">保存</button></div>
    </form>
  </div>

  <script>
    const API_URL = 'https://vcwwtrss.cn-east-fn.bytedance.net';
    const STORAGE_KEY = 'baby-bag-checklist-cloud-cache-v1';
    const initialItems = [
      ['童泰实体店购','59码连体衣','厚×1；夹棉×1；四季×1',''],['童泰实体店购','52码连体衣','夹棉×1；四季×2',''],['童泰实体店购','52码半背衣','×2',''],['童泰实体店购','包单','×2 + 1厚',''],['童泰实体店购','铺床小褥子 + 毛毯','',''],['童泰实体店购','浴巾','×1',''],['童泰实体店购','袜子 + 胎帽','袜子×4；胎帽×2',''],['童泰实体店购','600g包被','',''],['童泰实体店购','口水巾圈','×2',''],
      ['妈妈部分','定温烧水壶','',''],['妈妈部分','食品级包装袋','','上面写物品名字'],['妈妈部分','吸奶器','',''],['妈妈部分','储奶袋','',''],['妈妈部分','防溢乳贴','',''],['妈妈部分','收腹带','',''],['妈妈部分','私处冲洗器','',''],['妈妈部分','产褥垫','',''],['妈妈部分','会阴冷敷贴','',''],['妈妈部分','安睡裤','',''],['妈妈部分','吸管水杯','',''],['妈妈部分','月子服','',''],['妈妈部分','月子鞋','',''],['妈妈部分','哺乳内衣','',''],['妈妈部分','待产包','',''],
      ['宝宝部分·吃','160毫升玻璃奶瓶','',''],['宝宝部分·吃','小罐奶粉','',''],['宝宝部分·吃','硅胶奶瓶刷','',''],['宝宝部分·吃','奶瓶清洁剂','',''],['宝宝部分·吃','硅胶小勺','',''],['宝宝部分·吃','AD','',''],['宝宝部分·吃','益生菌拜奥','',''],
      ['宝宝部分·用','安抚奶嘴','',''],['宝宝部分·用','恒温壶','',''],['宝宝部分·用','毯子','',''],['宝宝部分·用','口水巾','4',''],['宝宝部分·用','长条巾','3',''],['宝宝部分·用','防惊跳包巾','',''],['宝宝部分·用','睡袋','',''],['宝宝部分·用','尿布','','防止红屁股'],['宝宝部分·用','酵素洗衣液 + 衣架','',''],['宝宝部分·用','小夜灯','','大灯晚上用伤视力'],
      ['宝宝部分·洗护','洗护二合一','','洗胎脂'],['宝宝部分·洗护','身体乳','','避免干性湿疹'],['宝宝部分·洗护','抚触油','','结合身体乳去胎皮'],['宝宝部分·洗护','护臀膏','','换完尿布用'],['宝宝部分·洗护','面霜','',''],['宝宝部分·洗护','护脐带 + 碘伏棉签','',''],['宝宝部分·洗护','澡盆 + 脸盆','',''],
      ['宝宝部分·消耗品','一次性隔尿垫','M码60-70片',''],['宝宝部分·消耗品','棉柔巾','','频率高，多囤'],['宝宝部分·消耗品','云柔巾','',''],['宝宝部分·消耗品','纸尿裤','7-8斤：S码200片；5-6斤：NB100 + S100',''],['宝宝部分·消耗品','新生儿小剪刀','',''],
      ['大件','消毒柜','',''],['大件','看护器','',''],['大件','婴儿洗衣机','',''],['大件','婴儿车','',''],['大件','婴儿床','',''],['大件','安全座椅','','']
    ].map((item, index) => ({ id: crypto.randomUUID ? crypto.randomUUID() : `item-${Date.now()}-${index}`, category:item[0], name:item[1], qty:item[2], note:item[3], done:index < 12 || ['会阴冷敷贴','吸管水杯','硅胶小勺'].includes(item[1]), createdAt:Date.now()+index }));
    let items = [];
    let lastCloudUpdatedAt = 0;
    let saveTimer = null;
    const $ = s => document.querySelector(s);
    const listRoot = $('#listRoot'), emptyState = $('#emptyState'), searchInput = $('#searchInput'), categoryFilter = $('#categoryFilter'), statusFilter = $('#statusFilter'), modal = $('#itemModal'), itemForm = $('#itemForm'), imageInput = $('#itemImage'), imagePreview = $('#imagePreview'), removeImageBtn = $('#removeImageBtn');
    let currentImageData = '';
    function loadItems(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || initialItems; } catch { return initialItems; } }
    function setSyncStatus(text){ const node = $('#syncStatus'); if (node) node.textContent = text; }
    async function loadFromCloud(){
      setSyncStatus('云端同步中…');
      try {
        const response = await fetch(`${API_URL}/api/v1/checklist`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        items = Array.isArray(data.items) ? data.items : initialItems;
        lastCloudUpdatedAt = data.updatedAt || Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        setSyncStatus('已云端同步');
      } catch (error) {
        console.warn('读取云端清单失败，暂用本地缓存', error);
        items = loadItems();
        setSyncStatus('云端连接失败，暂存本机');
      }
      renderList();
    }
    async function refreshFromCloud(){
      try {
        const response = await fetch(`${API_URL}/api/v1/checklist`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.updatedAt && data.updatedAt !== lastCloudUpdatedAt) {
          items = Array.isArray(data.items) ? data.items : items;
          lastCloudUpdatedAt = data.updatedAt;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          setSyncStatus('已同步最新');
          renderList();
        }
      } catch (error) {
        console.warn('刷新云端清单失败', error);
      }
    }
    function saveItems(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      setSyncStatus('正在保存…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const response = await fetch(`${API_URL}/api/v1/checklist`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items })
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          lastCloudUpdatedAt = data.updatedAt || Date.now();
          setSyncStatus('已云端同步');
        } catch (error) {
          console.warn('保存云端清单失败', error);
          setSyncStatus('保存失败，稍后重试');
        }
      }, 250);
    }
    async function resetCloud(){
      setSyncStatus('正在恢复…');
      try {
        const response = await fetch(`${API_URL}/api/v1/checklist/reset`, { method: 'POST' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        items = Array.isArray(data.items) ? data.items : initialItems;
        lastCloudUpdatedAt = data.updatedAt || Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        setSyncStatus('已云端同步');
        renderList();
      } catch (error) {
        console.warn('恢复云端清单失败', error);
        items = initialItems;
        saveItems();
        renderList();
      }
    }
    function categories(){ return [...new Set(items.map(i => i.category))]; }
    function escapeHtml(str=''){ return String(str).replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag])); }
    function updateImagePreview(){ imagePreview.src = currentImageData || ''; imagePreview.classList.toggle('show', Boolean(currentImageData)); removeImageBtn.style.display = currentImageData ? 'inline-block' : 'none'; }
    function openModal(item=null, defaultCategory=''){
      document.body.style.overflow='hidden'; modal.classList.add('show'); $('#modalTitle').textContent=item?'编辑物品':'新增物品';
      $('#itemId').value=item?.id||''; $('#itemName').value=item?.name||''; $('#itemCategory').value=item?.category||defaultCategory||categories()[0]||'待产清单';
      $('#itemQty').value=item?.qty||''; $('#itemNote').value=item?.note||''; currentImageData = item?.image || ''; imageInput.value=''; updateImagePreview();
      setTimeout(()=>$('#itemName').focus(),60);
    }
    function closeModal(){ modal.classList.remove('show'); document.body.style.overflow=''; itemForm.reset(); currentImageData=''; updateImagePreview(); }
    function filteredItems(){ const q=searchInput.value.trim().toLowerCase(), c=categoryFilter.value, s=statusFilter.value; return items.filter(i => [i.name,i.category,i.qty,i.note].join(' ').toLowerCase().includes(q) && (c==='all'||i.category===c) && (s==='all'||(s==='done'?i.done:!i.done))); }
    function renderControls(){ const current=categoryFilter.value||'all'; categoryFilter.innerHTML='<option value="all">全部分类</option>'+categories().map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join(''); categoryFilter.value=categories().includes(current)?current:'all'; $('#categoryOptions').innerHTML=categories().map(c=>`<option value="${escapeHtml(c)}"></option>`).join(''); }
    function renderStats(){ const done=items.filter(i=>i.done).length, total=items.length, pct=total?Math.round(done/total*100):0; $('#progressText').textContent=`${done}/${total}`; $('#progressBar').style.width=`${pct}%`; $('#totalCount').textContent=total; $('#doneCount').textContent=done; $('#todoCount').textContent=total-done; $('#categoryStats').innerHTML=categories().map(c=>{ const g=items.filter(i=>i.category===c), d=g.filter(i=>i.done).length, p=g.length?Math.round(d/g.length*100):0; return `<button class="stat-card" data-filter-category="${escapeHtml(c)}"><div class="stat-top"><span>${escapeHtml(c)}</span><b>${p}%</b></div><p>${d}/${g.length} 已完成</p><div class="bar"><i style="width:${p}%"></i></div></button>`; }).join(''); }
    function renderList(){
      renderControls(); renderStats();
      const visible=filteredItems(), grouped=visible.reduce((a,i)=>{(a[i.category] ||= []).push(i); return a;},{});
      listRoot.innerHTML=''; emptyState.classList.toggle('show', visible.length===0);
      Object.entries(grouped).forEach(([category, group])=>{
        const section=document.createElement('article'); section.className='section';
        section.innerHTML=`<div class="section-head"><div><h2>${escapeHtml(category)}</h2><p class="section-sub">${group.filter(i=>i.done).length}/${group.length} 已完成</p></div><button class="add-category">＋ 添加到此类</button></div><div class="items"></div>`;
        section.querySelector('.add-category').addEventListener('click',()=>openModal(null,category));
        const box=section.querySelector('.items');
        group.sort((a,b)=>a.createdAt-b.createdAt).forEach(item=>{
          const row=document.createElement('div'); row.className=`item ${item.done?'done':''}`;
          const imageHtml = item.image ? `<img class="thumb" src="${item.image}" alt="${escapeHtml(item.name)}图片">` : '';
          row.innerHTML=`<label><input type="checkbox" ${item.done?'checked':''} data-action="toggle" data-id="${item.id}"><span class="item-content">${imageHtml}<span><span class="item-title">${escapeHtml(item.name)}</span><span class="item-meta">${item.qty?`<strong>${escapeHtml(item.qty)}</strong>`:''}${item.qty&&item.note?' · ':''}${escapeHtml(item.note||'')}</span></span></span></label><div class="item-actions"><button class="small-btn edit-btn" data-action="edit" data-id="${item.id}">编辑</button><button class="small-btn delete-btn" data-action="delete" data-id="${item.id}">删除</button></div>`;
          box.appendChild(row);
        });
        listRoot.appendChild(section);
      });
    }
    function fileToCompressedDataUrl(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const max = 900;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    $('#addTopBtn').addEventListener('click',()=>openModal()); $('#closeModalBtn').addEventListener('click',closeModal); $('#cancelBtn').addEventListener('click',closeModal); modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); }); searchInput.addEventListener('input',renderList); categoryFilter.addEventListener('change',renderList); statusFilter.addEventListener('change',renderList);
    imageInput.addEventListener('change', async e => { const file=e.target.files && e.target.files[0]; if(!file) return; currentImageData = await fileToCompressedDataUrl(file); updateImagePreview(); });
    removeImageBtn.addEventListener('click', () => { currentImageData=''; imageInput.value=''; updateImagePreview(); });
    $('#categoryStats').addEventListener('click', e => { const btn=e.target.closest('[data-filter-category]'); if(!btn) return; categoryFilter.value=btn.dataset.filterCategory; renderList(); window.scrollTo({top:250, behavior:'smooth'}); });
    listRoot.addEventListener('click', e => { const t=e.target.closest('[data-action]'); if(!t) return; const item=items.find(i=>i.id===t.dataset.id); if(!item) return; if(t.dataset.action==='toggle') item.done=t.checked; if(t.dataset.action==='edit') return openModal(item); if(t.dataset.action==='delete' && confirm(`确定删除“${item.name}”吗？`)) items=items.filter(i=>i.id!==item.id); saveItems(); renderList(); });
    itemForm.addEventListener('submit', e => { e.preventDefault(); const id=$('#itemId').value; const payload={name:$('#itemName').value.trim(), category:$('#itemCategory').value.trim(), qty:$('#itemQty').value.trim(), note:$('#itemNote').value.trim(), image:currentImageData}; if(!payload.name||!payload.category) return; if(id) items=items.map(i=>i.id===id?{...i,...payload}:i); else items.push({id:crypto.randomUUID?crypto.randomUUID():`item-${Date.now()}`,...payload,done:false,createdAt:Date.now()}); saveItems(); closeModal(); renderList(); });
    $('#resetBtn').addEventListener('click',()=>{ if(confirm('恢复初始清单会覆盖所有人看到的云端记录，确定继续吗？')) resetCloud(); });
    loadFromCloud();
    setInterval(refreshFromCloud, 15000);
  </script>
</body>
