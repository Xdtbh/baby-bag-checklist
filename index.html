<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>孕妇备产清单</title>
  <style>
    * { box-sizing: border-box; }
    :root { --rose:#e85d8b; --rose-dark:#be2f62; --ink:#172033; --muted:#667085; --paper:rgba(255,255,255,.82); --shadow:0 24px 70px rgba(170,93,121,.16); --green:#087f5b; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; background: radial-gradient(circle at 15% 14%, rgba(252,186,211,.55), transparent 27%), radial-gradient(circle at 86% 4%, rgba(183,209,255,.42), transparent 28%), radial-gradient(circle at 48% 98%, rgba(255,228,181,.48), transparent 30%), linear-gradient(135deg,#fff7fa,#fff1f4 48%,#fff8ec); }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; border:0; }
    .wrap { width:min(520px, calc(100% - 20px)); margin:0 auto; }
    .hero { margin:14px auto 14px; padding:22px; border-radius:28px; background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(255,244,248,.86)); border:1px solid rgba(255,255,255,.9); box-shadow:var(--shadow); backdrop-filter: blur(22px); display:grid; grid-template-columns:1fr; gap:18px; align-items:center; position:relative; overflow:hidden; }
    .hero:after { content:""; position:absolute; right:-70px; top:-80px; width:240px; height:240px; border-radius:50%; background:rgba(232,93,139,.13); }
    .hero > * { position:relative; z-index:1; }
    .pill { display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:999px; background:rgba(255,255,255,.76); color:var(--rose-dark); font-weight:800; border:1px solid #ffe0e8; }
    .sync-mini { display:inline-flex; align-items:center; align-self:center; gap:6px; min-height:38px; padding:8px 10px; border-radius:999px; color:#667085; background:rgba(255,255,255,.58); font-size:12px; font-weight:700; }
    .sync-mini:before { content:""; width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.12); }
    h1 { margin:12px 0 0; font-size:clamp(30px, 9vw, 42px); line-height:1.08; letter-spacing:-.04em; }
    .lead { margin:14px 0 0; max-width:720px; color:#5d6679; line-height:1.75; font-size:15px; }
    .hero-note { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; color:#7a5061; font-size:13px; }
    .hero-note span { padding:7px 10px; border-radius:999px; background:rgba(255,255,255,.62); border:1px solid rgba(255,224,232,.9); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; align-items:center; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:12px 20px; font-weight:850; transition:.2s ease; }
    .btn:hover { transform:translateY(-1px); }
    .btn-primary { color:#fff; background:#111827; box-shadow:0 14px 30px rgba(232,93,139,.24); }
    .btn-primary:hover { background:var(--rose-dark); }
    .btn-soft { color:var(--rose-dark); background:rgba(255,255,255,.86); border:1px solid #ffd9e4; }
    .progress-card { border-radius:28px; padding:22px; background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,228,236,.84)); border:1px solid rgba(255,255,255,.92); }
    .progress-head { display:flex; justify-content:space-between; gap:16px; align-items:center; }
    .eyebrow { margin:0; color:var(--rose-dark); font-size:14px; font-weight:850; }
    .big-number { margin:4px 0 0; font-size:36px; font-weight:950; letter-spacing:-.04em; }
    .badge { width:64px; height:64px; display:grid; place-items:center; border-radius:18px; background:#fff; color:var(--rose-dark); font-size:36px; box-shadow: inset 0 0 0 1px #ffe2ea; }
    .bar { height:14px; margin-top:18px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.9); border:1px solid #ffe0e8; }
    .bar > i { display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#fb7185,#ec4899,#fb923c); transition:width .45s ease; }
    .mini-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
    .mini { padding:12px; text-align:center; background:rgba(255,255,255,.78); border-radius:18px; }
    .mini span { display:block; color:var(--muted); font-size:12px; }
    .mini strong { display:block; margin-top:2px; font-size:22px; }
    .toolbar { position:sticky; top:10px; z-index:10; margin-bottom:12px; padding:8px; border-radius:20px; background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.9); box-shadow:0 12px 30px rgba(170,93,121,.1); backdrop-filter:blur(18px); display:flex; align-items:center; gap:6px; }
    .toolbar select { width:110px; flex:0 0 110px; padding:10px 8px; border-radius:16px; font-size:13px; }
    .toolbar #statusFilter { width:78px; flex-basis:78px; }
    .searchbox { position:relative; flex:1 1 auto; min-width:0; }
    .searchbox span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#98a2b3; font-size:13px; }
    input, select, textarea { width:100%; border:1px solid #ffe0e8; outline:0; background:rgba(255,255,255,.9); border-radius:18px; padding:13px 15px; color:#243047; }
    .searchbox input { height:42px; padding:10px 10px 10px 32px; border-radius:16px; font-size:13px; }
    input:focus, select:focus, textarea:focus { border-color:#f5a5bd; box-shadow:0 0 0 4px rgba(232,93,139,.12); }
    .category-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
    .stat-card { text-align:left; padding:16px; border-radius:24px; background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.8); box-shadow:0 12px 34px rgba(170,93,121,.08); transition:.2s ease; }
    .stat-card:hover { transform:translateY(-2px); box-shadow:0 18px 45px rgba(170,93,121,.14); }
    .stat-top { display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:900; }
    .stat-top b { color:var(--rose-dark); }
    .stat-card p { margin:6px 0 0; color:var(--muted); font-size:14px; }
    .list { display:grid; gap:14px; padding-bottom:40px; }
    .section { overflow:hidden; border-radius:26px; background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.9); box-shadow:0 12px 36px rgba(170,93,121,.09); }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; border-bottom:1px solid #ffe5ec; background:rgba(255,255,255,.62); }
    .section-head > div:first-child { min-width:0; flex:1 1 auto; }
    .section-title { display:flex; align-items:center; gap:10px; flex-wrap:nowrap; min-width:0; }
    .section h2 { margin:0; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:22px; letter-spacing:-.02em; }
    .section-sub { margin:4px 0 0; color:var(--muted); font-size:14px; white-space:nowrap; }
    .section-actions { display:flex; flex:0 0 auto; gap:8px; flex-wrap:nowrap; justify-content:flex-end; }
    .add-category, .rename-category { color:var(--rose-dark); background:#fff0f5; padding:10px 15px; border-radius:999px; font-weight:850; white-space:nowrap; }
    .rename-category { color:#475467; background:#f7f5f6; }
    .items { display:grid; }
    .swipe-row { position:relative; overflow:hidden; border-top:1px solid #fff1f5; background:rgba(255,255,255,.35); touch-action:pan-y; }
    .swipe-row:first-child { border-top:0; }
    .item { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 14px; background:#fff; transition:background .22s ease; }
    .item { cursor:pointer; }
    .item input[type="checkbox"] { width:20px; height:20px; flex:0 0 auto; margin:2px 0 0; accent-color:var(--rose); box-shadow:none; cursor:pointer; }
    .item-title-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .item-title { display:inline; font-weight:900; line-height:1.35; word-break:break-word; }
    .item-meta { display:block; margin-top:5px; color:var(--muted); font-size:14px; line-height:1.55; }
    .item-price { display:inline-flex; padding:3px 8px; border-radius:999px; color:var(--rose-dark); background:#fff0f5; font-size:13px; font-weight:900; white-space:nowrap; }
    .item-meta strong { color:#344054; }
    .swipe-row.done .item { background:linear-gradient(90deg, rgba(236,253,245,.96), rgba(248,255,252,.93)); }
    .swipe-row.done .item-title { color:var(--green); text-decoration:none; }
    .item-content { min-width:0; flex:1; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; }
    .item-main { min-width:0; }
    .thumb-row { display:flex; gap:6px; justify-self:end; max-width:122px; overflow-x:auto; padding:2px 0; scrollbar-width:none; }
    .thumb-row::-webkit-scrollbar { display:none; }
    .thumb { width:42px; height:42px; flex:0 0 auto; border-radius:14px; object-fit:cover; border:1px solid #ffe0e8; background:#fff7fa; box-shadow:0 6px 14px rgba(170,93,121,.12); }
    .image-upload { display:grid; gap:10px; padding:14px; border:1px dashed #f3b8c9; border-radius:20px; background:#fff8fb; }
    .preview-strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
    .image-preview { width:88px; height:88px; flex:0 0 auto; border-radius:22px; object-fit:cover; border:1px solid #ffe0e8; }
    .link-btn { width:auto; color:var(--rose-dark); background:transparent; padding:0; font-weight:850; text-align:left; }
    .empty { display:none; margin-bottom:50px; padding:44px; text-align:center; border-radius:30px; border:1px dashed #f2b8c8; background:rgba(255,255,255,.72); }
    .empty.show { display:block; }
    .empty .icon { display:block; font-size:48px; color:#f3a8bd; }
    .modal { display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center; padding:18px; background:rgba(15,23,42,.38); }
    .modal.show { display:flex; }
    .dialog { width:min(580px,100%); max-height:calc(100vh - 36px); overflow:auto; padding:24px; border-radius:30px; background:#fff; box-shadow:0 28px 90px rgba(15,23,42,.24); }
    .dialog-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .dialog-title { margin:4px 0 0; font-size:28px; font-weight:950; }
    .close { width:40px; height:40px; border-radius:999px; color:#667085; background:#f2f4f7; font-size:24px; }
    .form-grid { display:grid; gap:15px; }
    label.field { display:grid; gap:8px; color:#344054; font-size:14px; font-weight:850; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .category-grid { display:grid; grid-template-columns:1fr; gap:10px; }
    textarea { resize:vertical; min-height:92px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .dialog-actions .delete-modal { margin-right:auto; color:#fff; background:#e11d48; }
    .cancel { background:#f2f4f7; color:#475467; }
    .save { background:var(--rose); color:#fff; }
    .icon { display:inline-flex; align-items:center; justify-content:center; line-height:1; }
    @media (max-width: 900px) { .hero { grid-template-columns:1fr; padding:22px; } }
    @media (max-width: 640px) { .wrap { width:min(100% - 20px,520px); } .hero { margin-top:12px; border-radius:26px; } .mini-stats { grid-template-columns:repeat(2,1fr); } .two-col { grid-template-columns:1fr; } .section-head { align-items:center; flex-direction:row; gap:8px; padding:14px 12px; } .section h2 { font-size:20px; } .section-sub { font-size:13px; } .section-actions { justify-content:flex-end; gap:6px; } .add-category, .rename-category { width:auto; padding:8px 9px; font-size:12px; letter-spacing:-.02em; } }
  </style>
</head>
<body>
  <header class="wrap hero">
    <div>
      <div class="pill"><span class="icon">♡</span> 给宝宝和妈妈的安心准备</div>
      <h1>待产清单，安心准备</h1>
      <p class="lead">把待买、待带、待确认的物品统一收进云端清单。家人打开同一个链接即可查看最新进度，勾选、补充和图片记录都会实时同步。</p>
      <div class="hero-note"><span>云端共享</span><span>自定义分类</span><span>多图记录</span></div>
      <div class="actions">
        <button id="addTopBtn" class="btn btn-primary"><span class="icon">＋</span> 新增物品</button>
        <span id="syncStatus" class="sync-mini">同步中</span>
      </div>
    </div>
    <aside class="progress-card">
      <div class="progress-head"><div><p class="eyebrow">当前完成度</p><p id="progressText" class="big-number">0/0</p></div><div class="badge">✓</div></div>
      <div class="bar"><i id="progressBar"></i></div>
      <div class="mini-stats"><div class="mini"><span>总计</span><strong id="totalCount">0</strong></div><div class="mini"><span>已完成</span><strong id="doneCount">0</strong></div><div class="mini"><span>待准备</span><strong id="todoCount">0</strong></div><div class="mini"><span>累计花费</span><strong id="totalAmount">¥0</strong></div></div>
    </aside>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <label class="searchbox"><span>⌕</span><input id="searchInput" placeholder="搜索物品" /></label>
      <select id="categoryFilter"></select>
      <select id="statusFilter"><option value="all">状态</option><option value="todo">待准备</option><option value="done">已完成</option></select>
    </section>
    <section id="categoryStats" class="category-stats"></section>
    <section id="listRoot" class="list"></section>
    <section id="emptyState" class="empty"><span class="icon">⌕</span><h2>没有找到匹配物品</h2><p>试试换个关键词，或新增一个清单项。</p></section>
  </main>

  <div id="itemModal" class="modal">
    <form id="itemForm" class="dialog">
      <div class="dialog-head"><div><p class="eyebrow">清单编辑</p><h2 id="modalTitle" class="dialog-title">新增物品</h2></div><button type="button" id="closeModalBtn" class="close">×</button></div>
      <input type="hidden" id="itemId" />
      <div class="form-grid">
        <label class="field">物品名称<input id="itemName" required placeholder="例如：160毫升玻璃奶瓶" /></label>
        <div class="two-col"><label class="field">数量/规格<input id="itemQty" placeholder="例如：×1、S码200片" /></label><label class="field">金额（元）<input id="itemAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如：199.00" /></label></div>
        <label class="field">分类<select id="categorySelect"></select></label>
        <input id="itemCategory" type="hidden" required />
        <label class="field">备注<textarea id="itemNote" rows="3" placeholder="购买地点、用途或提醒"></textarea></label>
        <label class="field image-upload">物品图片（可多选，保存后横向展示在物品下方）
          <input id="itemImage" type="file" accept="image/*" multiple />
          <div id="imagePreview" class="preview-strip"></div>
          <button id="removeImageBtn" type="button" class="link-btn">清空图片</button>
        </label>
      </div>
      <div class="dialog-actions"><button type="button" id="deleteItemBtn" class="btn delete-modal">删除</button><button type="button" id="cancelBtn" class="btn cancel">取消</button><button class="btn save">保存</button></div>
    </form>
  </div>

  <script src="./config.js"></script>
  <script>
    const CLOUDBASE_ENV_ID = window.CLOUDBASE_ENV_ID || '';
    const CLOUDBASE_REGION = window.CLOUDBASE_REGION || 'ap-shanghai';
    const CLOUDBASE_SDK_URL = './vendor/cloudbase.full.js';
    const STATE_COLLECTION = window.CLOUDBASE_COLLECTION || 'checklist_items';
    const STATE_DOC_ID = 'shared';
    let cloudbaseApp = null;
    let cloudbaseSdkPromise = null;
    const imageUrlCache = new Map();
    let items = [];
    let cloudbaseReady = null;
    let remoteBusy = false;
    let currentImages = [];
    const $ = s => document.querySelector(s);
    const listRoot = $('#listRoot'), emptyState = $('#emptyState'), searchInput = $('#searchInput'), categoryFilter = $('#categoryFilter'), statusFilter = $('#statusFilter'), modal = $('#itemModal'), itemForm = $('#itemForm'), imageInput = $('#itemImage'), imagePreview = $('#imagePreview'), removeImageBtn = $('#removeImageBtn'), categorySelect = $('#categorySelect'), deleteItemBtn = $('#deleteItemBtn');
    function setSyncStatus(text){ const node = $('#syncStatus'); if (node) node.textContent = text; }
    function cloudErrorStatus(error, fallback='保存失败'){
      const message = String(error?.message || error || '');
      if (message.includes('anonymous authentication is disabled')) return '匿名未开';
      if (message.includes('INVALID_OPERATION')) return '认证失败';
      if (message.includes('permission') || message.includes('PERMISSION') || message.includes('403')) return '权限不足';
      if (message.includes('not exist') || message.includes('404')) return '集合不存在';
      return fallback;
    }
    function newItemId(){ return crypto.randomUUID ? crypto.randomUUID() : `item-${Date.now()}-${Math.random().toString(16).slice(2)}`; }
    function sortItems(list){ return [...list].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0) || String(a.name).localeCompare(String(b.name), 'zh-CN')); }
    function parseAmount(value){ const amount = Number(String(value ?? '').replace(/[¥￥,，\s元]/g, '')); return Number.isFinite(amount) && amount > 0 ? Math.round(amount * 100) / 100 : 0; }
    function formatAmount(value){ const amount = parseAmount(value); return amount ? `¥${amount.toLocaleString('zh-CN', { maximumFractionDigits:2 })}` : ''; }
    function normalizeItem(item, stamp=Date.now()){
      return {
        id:item.id || item._id || newItemId(),
        category:(item.category || '待产清单').trim(),
        name:(item.name || '').trim(),
        qty:item.qty || '',
        amount:parseAmount(item.amount ?? item.price ?? item.cost),
        note:item.note || '',
        done:Boolean(item.done),
        images:normalizeImages(item),
        createdAt:item.createdAt || stamp,
        updatedAt:item.updatedAt || stamp,
        deleted:Boolean(item.deleted)
      };
    }
    function toCloudItem(item){ const next = normalizeItem(item, Date.now()); delete next._id; return next; }
    function fromCloudItem(doc){
      const body = doc?.data && typeof doc.data === 'object' && !Array.isArray(doc.data) ? doc.data : doc;
      return normalizeItem({ ...body, id:body?.id || doc?._id });
    }
    function loadCloudbaseSdk(){
      if (window.cloudbase) return Promise.resolve();
      if (!cloudbaseSdkPromise) {
        cloudbaseSdkPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = CLOUDBASE_SDK_URL;
          script.onload = resolve;
          script.onerror = () => reject(new Error('CloudBase SDK 加载失败'));
          document.head.appendChild(script);
        });
      }
      return cloudbaseSdkPromise;
    }
    async function ensureCloudbase(){
      if (!CLOUDBASE_ENV_ID) throw new Error('CloudBase 环境 ID 未配置');
      await loadCloudbaseSdk();
      if (!cloudbaseApp) cloudbaseApp = window.cloudbase.init({ env: CLOUDBASE_ENV_ID, region: CLOUDBASE_REGION });
      if (!cloudbaseReady) {
        cloudbaseReady = (async () => {
          const auth = cloudbaseApp.auth({ persistence: 'local' });
          const loginState = await auth.getLoginState().catch(() => null);
          if (!loginState) {
            if (auth.anonymousAuthProvider) await auth.anonymousAuthProvider().signIn();
            else if (auth.signInAnonymously) await auth.signInAnonymously();
          }
          return cloudbaseApp.database();
        })();
      }
      return cloudbaseReady;
    }
    async function getCollection(){ const db = await ensureCloudbase(); return db.collection(STATE_COLLECTION); }
    async function listRemoteItems(){
      const collection = await getCollection();
      const result = await collection.limit(1000).get();
      const docs = Array.isArray(result.data) ? result.data : [];
      const toActiveItems = list => list.map(fromCloudItem).filter(item => item.id && item.name && !item.deleted);
      const itemDocs = docs.filter(doc => doc && doc._id !== STATE_DOC_ID && !Array.isArray(doc.items) && !Array.isArray(doc.data?.items));
      const activeItems = toActiveItems(itemDocs);
      if (activeItems.length) return sortItems(activeItems);
      const legacyDoc = docs.find(doc => doc && (doc._id === STATE_DOC_ID || Array.isArray(doc.items) || Array.isArray(doc.data?.items)));
      const legacyItems = legacyDoc?.data?.items || legacyDoc?.items;
      return Array.isArray(legacyItems) ? sortItems(toActiveItems(legacyItems)) : [];
    }
    async function upsertRemoteItem(item){ const collection = await getCollection(); const next = toCloudItem(item); await collection.doc(next.id).set({ data:next }); return next; }
    async function deleteRemoteItem(id){ const collection = await getCollection(); await collection.doc(id).remove(); }
    async function syncFromRemote(status='已同步'){
      items = await listRemoteItems();
      renderList(); setSyncStatus(status);
    }
    async function runRemoteMutation(label, action){
      remoteBusy = true; setSyncStatus(label);
      try { await action(); setSyncStatus('已同步'); }
      catch (error) { console.warn(`${label}失败`, error); setSyncStatus(CLOUDBASE_ENV_ID ? cloudErrorStatus(error, '保存失败') : '待配置'); }
      finally { remoteBusy = false; }
    }
    async function loadFromCloud(){
      setSyncStatus('同步中');
      try { await syncFromRemote('已同步'); }
      catch (error) { console.warn('读取 CloudBase 清单失败', error); items = []; setSyncStatus(CLOUDBASE_ENV_ID ? cloudErrorStatus(error, '读取失败') : '待配置'); renderList(); }
    }
    function applyLocal(nextItems){ items = sortItems(nextItems); renderList(); }
    function saveItem(item){
      const next = normalizeItem({ ...item, updatedAt:Date.now() });
      applyLocal(items.some(i=>i.id===next.id) ? items.map(i=>i.id===next.id?next:i) : [...items, next]);
      runRemoteMutation('保存中', () => upsertRemoteItem(next));
    }
    function removeItem(id){
      applyLocal(items.filter(item => item.id !== id));
      runRemoteMutation('删除中', () => deleteRemoteItem(id));
    }
    function saveMany(nextItems, label='保存中'){
      const normalized = sortItems(nextItems.map(item => normalizeItem({ ...item, updatedAt:Date.now() })));
      applyLocal(normalized);
      runRemoteMutation(label, async () => { await Promise.all(normalized.map(upsertRemoteItem)); });
    }
    function categories(){ return [...new Set(items.map(i => i.category).filter(Boolean))]; }
    function escapeHtml(str=''){ return String(str).replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag])); }
    function isCloudFile(src=''){ return String(src).startsWith('cloud://'); }
    function imageSrc(src){ return isCloudFile(src) ? (imageUrlCache.get(src) || '') : src; }
    function renderCategorySelect(selected='') { categorySelect.innerHTML = categories().map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '<option value="__new__">＋ 新增分类</option>'; categorySelect.value = categories().includes(selected) ? selected : '__new__'; }
    function normalizeImages(item){ return Array.isArray(item?.images) ? item.images : (item?.image ? [item.image] : []); }
    async function resolveCloudImageUrls(){
      if (!CLOUDBASE_ENV_ID) return;
      const fileIDs = [...new Set(items.flatMap(normalizeImages).concat(currentImages).filter(src => isCloudFile(src) && !imageUrlCache.has(src)))];
      if (!fileIDs.length) return;
      try {
        await ensureCloudbase();
        const result = await cloudbaseApp.getTempFileURL({ fileList:fileIDs.map(fileID => ({ fileID, maxAge:3600 })) });
        (result.fileList || []).forEach(file => {
          const fileID = file.fileID || file.fileid;
          const url = file.tempFileURL || file.download_url || file.downloadUrl;
          if (fileID && url) imageUrlCache.set(fileID, url);
        });
        renderList(); updateImagePreview(false);
      } catch (error) { console.warn('获取 CloudBase 图片链接失败', error); }
    }
    function updateImagePreview(shouldResolve=true){ imagePreview.innerHTML = currentImages.map((src, index) => `<img class="image-preview" src="${escapeHtml(imageSrc(src) || src)}" alt="第${index + 1}张预览图">`).join(''); removeImageBtn.style.display = currentImages.length ? 'inline-block' : 'none'; if (shouldResolve) resolveCloudImageUrls(); }
    function openModal(item=null, defaultCategory=''){
      document.body.style.overflow='hidden'; modal.classList.add('show'); $('#modalTitle').textContent=item?'编辑物品':'新增物品';
      const selectedCategory = item?.category || defaultCategory || categories()[0] || '待产清单';
      renderCategorySelect(selectedCategory); $('#itemId').value=item?.id||''; $('#itemName').value=item?.name||''; $('#itemCategory').value=selectedCategory; $('#itemQty').value=item?.qty||''; $('#itemAmount').value=item?.amount || ''; $('#itemNote').value=item?.note||''; deleteItemBtn.style.display = item ? 'inline-flex' : 'none'; currentImages = normalizeImages(item); imageInput.value=''; updateImagePreview(); setTimeout(()=>$('#itemName').focus(),60);
    }
    function closeModal(){ modal.classList.remove('show'); document.body.style.overflow=''; itemForm.reset(); deleteItemBtn.style.display='none'; currentImages=[]; updateImagePreview(); }
    function filteredItems(){ const q=searchInput.value.trim().toLowerCase(), c=categoryFilter.value, s=statusFilter.value; return items.filter(i => [i.name,i.category,i.qty,i.note,formatAmount(i.amount)].join(' ').toLowerCase().includes(q) && (c==='all'||i.category===c) && (s==='all'||(s==='done'?i.done:!i.done))); }
    function renderControls(){ const current=categoryFilter.value||'all'; categoryFilter.innerHTML='<option value="all">全部分类</option>'+categories().map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join(''); categoryFilter.value=categories().includes(current)?current:'all'; }
    function renderStats(){ const done=items.filter(i=>i.done).length, total=items.length, pct=total?Math.round(done/total*100):0, amount=items.reduce((sum,item)=>sum+parseAmount(item.amount),0); $('#progressText').textContent=`${done}/${total}`; $('#progressBar').style.width=`${pct}%`; $('#totalCount').textContent=total; $('#doneCount').textContent=done; $('#todoCount').textContent=total-done; $('#totalAmount').textContent=formatAmount(amount) || '¥0'; $('#categoryStats').innerHTML=categories().map(c=>{ const g=items.filter(i=>i.category===c), d=g.filter(i=>i.done).length, p=g.length?Math.round(d/g.length*100):0, a=g.reduce((sum,item)=>sum+parseAmount(item.amount),0); return `<button class="stat-card" data-filter-category="${escapeHtml(c)}"><div class="stat-top"><span>${escapeHtml(c)}</span><b>${p}%</b></div><p>${d}/${g.length} 已完成${a ? ` · ${formatAmount(a)}` : ''}</p><div class="bar"><i style="width:${p}%"></i></div></button>`; }).join(''); }
    function renderList(){
      renderControls(); renderStats(); const visible=filteredItems(), grouped=visible.reduce((a,i)=>{(a[i.category] ||= []).push(i); return a;},{}); listRoot.innerHTML=''; emptyState.classList.toggle('show', visible.length===0);
      Object.entries(grouped).forEach(([category, group])=>{
        const section=document.createElement('article'); section.className='section';
        section.innerHTML=`<div class="section-head"><div><div class="section-title"><h2>${escapeHtml(category)}</h2></div><p class="section-sub">${group.filter(i=>i.done).length}/${group.length} 已完成</p></div><div class="section-actions"><button class="rename-category" data-category="${escapeHtml(category)}">编辑分类名</button><button class="add-category">＋ 添加到此类</button></div></div><div class="items"></div>`;
        section.querySelector('.add-category').addEventListener('click',()=>openModal(null,category)); section.querySelector('.rename-category').addEventListener('click',()=>renameCategory(category));
        const box=section.querySelector('.items');
        group.sort((a,b)=>a.createdAt-b.createdAt).forEach(item=>{
          const row=document.createElement('div'); row.className=`swipe-row ${item.done?'done':''}`; row.dataset.id = item.id;
          const imageList = normalizeImages(item);
          const imageHtml = imageList.length ? `<div class="thumb-row">${imageList.map((src, index) => `<img class="thumb" src="${escapeHtml(imageSrc(src) || src)}" alt="${escapeHtml(item.name)}图片${index + 1}">`).join('')}</div>` : '';
          const priceHtml = formatAmount(item.amount) ? `<span class="item-price">${formatAmount(item.amount)}</span>` : '';
          row.innerHTML=`<div class="item" data-action="open" data-id="${item.id}"><span class="item-content"><span class="item-main"><span class="item-title-row"><span class="item-title">${escapeHtml(item.name)}</span>${priceHtml}</span><span class="item-meta">${item.qty?`<strong>${escapeHtml(item.qty)}</strong>`:''}${item.qty&&item.note?' · ':''}${escapeHtml(item.note||'')}</span></span>${imageHtml}</span><input type="checkbox" ${item.done?'checked':''} data-action="toggle" data-id="${item.id}" aria-label="切换${escapeHtml(item.name)}完成状态"></div>`;
          box.appendChild(row);
        });
        listRoot.appendChild(section);
      });
      resolveCloudImageUrls();
    }
    function renameCategory(oldName){ const next = prompt('修改分类名称', oldName); if (!next || next.trim() === oldName) return; const name = next.trim(); saveMany(items.map(item => item.category === oldName ? { ...item, category:name } : item), '改分类中'); }
    function fileToCompressedDataUrl(file){ return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onerror = reject; reader.onload = () => { const img = new Image(); img.onerror = reject; img.onload = () => { const max = 900; const scale = Math.min(1, max / Math.max(img.width, img.height)); const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(img.width * scale)); canvas.height = Math.max(1, Math.round(img.height * scale)); canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height); resolve(canvas.toDataURL('image/jpeg', 0.82)); }; img.src = reader.result; }; reader.readAsDataURL(file); }); }
    async function uploadImage(file){
      if (!CLOUDBASE_ENV_ID) return fileToCompressedDataUrl(file);
      await ensureCloudbase();
      const ext = (file.name.match(/\.[a-zA-Z0-9]+$/)?.[0] || '.jpg').toLowerCase();
      const cloudPath = `baby-bag/${Date.now()}-${Math.random().toString(16).slice(2)}${ext}`;
      const result = await cloudbaseApp.uploadFile({ cloudPath, filePath:file });
      const fileID = result.fileID || result.fileId || result.cloudObjectId;
      if (!fileID) throw new Error('CloudBase 未返回 fileID');
      return fileID;
    }
    $('#addTopBtn').addEventListener('click',()=>openModal()); $('#closeModalBtn').addEventListener('click',closeModal); $('#cancelBtn').addEventListener('click',closeModal); modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); }); searchInput.addEventListener('input',renderList); categoryFilter.addEventListener('change',renderList); statusFilter.addEventListener('change',renderList); categorySelect.addEventListener('change', e => { if(e.target.value === '__new__') { const name = prompt('请输入新分类名称'); if(name && name.trim()) { $('#itemCategory').value = name.trim(); const option = new Option(name.trim(), name.trim()); categorySelect.add(option, categorySelect.options.length - 1); categorySelect.value = name.trim(); } else { categorySelect.value = $('#itemCategory').value || categories()[0] || '__new__'; } } else { $('#itemCategory').value = e.target.value; } });
    imageInput.addEventListener('change', async e => { const files=Array.from(e.target.files || []); if(!files.length) return; setSyncStatus(CLOUDBASE_ENV_ID ? '上传图片' : '处理图片'); try { const uploaded = await Promise.all(files.map(uploadImage)); currentImages = currentImages.concat(uploaded); updateImagePreview(); setSyncStatus(CLOUDBASE_ENV_ID ? '待保存' : '待配置'); } catch (error) { console.warn('图片上传失败', error); setSyncStatus(CLOUDBASE_ENV_ID ? cloudErrorStatus(error, '图片上传失败') : '处理失败'); } }); removeImageBtn.addEventListener('click', () => { currentImages=[]; imageInput.value=''; updateImagePreview(); });
    $('#categoryStats').addEventListener('click', e => { const btn=e.target.closest('[data-filter-category]'); if(!btn) return; categoryFilter.value=btn.dataset.filterCategory; renderList(); window.scrollTo({top:250, behavior:'smooth'}); });
    listRoot.addEventListener('click', e => {
      const actionNode = e.target.closest('[data-action]');
      const id = actionNode?.dataset.id || e.target.closest('.item')?.dataset.id;
      const item = items.find(i=>i.id===id);
      if(!item) return;
      if(actionNode?.dataset.action==='toggle') { e.stopPropagation(); saveItem({ ...item, done:actionNode.checked }); return; }
      openModal(item);
    });
    deleteItemBtn.addEventListener('click', () => { const id=$('#itemId').value; const item=items.find(i=>i.id===id); if(!item) return; if(confirm(`确定删除“${item.name}”吗？`)) { removeItem(id); closeModal(); } });
    itemForm.addEventListener('submit', e => { e.preventDefault(); const id=$('#itemId').value; const existing = items.find(i=>i.id===id); const payload={id:id || newItemId(), name:$('#itemName').value.trim(), category:$('#itemCategory').value.trim(), qty:$('#itemQty').value.trim(), amount:parseAmount($('#itemAmount').value), note:$('#itemNote').value.trim(), images:currentImages, done:existing?.done || false, createdAt:existing?.createdAt || Date.now()}; if(!payload.name||!payload.category) return; saveItem({ ...(existing || {}), ...payload, image:'' }); closeModal(); });
    loadFromCloud();
  </script>
</body>
</html>
